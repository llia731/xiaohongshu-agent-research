name: Public profile reachability (no login)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-profile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single unauthenticated public URL request
        run: python scripts/probe_public_profile.py --output public_profile_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-profile-probe
          path: public_profile_probe.json
