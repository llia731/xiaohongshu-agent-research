name: Hosted browser research (no login)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = inspect homepage; preview = inspect visible cards and click one'
        type: choice
        options: [probe, preview]
        default: probe
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-browser-research.yml'
      - 'scripts/hosted_browser_research.py'
permissions:
  contents: read
concurrency:
  group: xhs-hosted-public-research
  cancel-in-progress: true
jobs:
  browser-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUN_MODE: ${{ inputs.mode || 'probe' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: python -m pip install 'playwright==1.56.0'
      - name: Check normal public UI and stop on login or security limits
        run: python scripts/hosted_browser_research.py --mode "$RUN_MODE" --max-cards 10 --output-dir outputs/hosted
      - name: Upload public-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-hosted-browser-results
          path: outputs/hosted/
          retention-days: 3
          if-no-files-found: warn
